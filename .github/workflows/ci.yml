name: Code Quality & CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code quality
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --exclude-tags unstable

      - name: Verify example app
        run: |
          cd example
          flutter pub get
          flutter analyze
